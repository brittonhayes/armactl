version: "3"

tasks:
  default:
    cmds:
      - task -l

  mod:
    desc: download and tidy go modules
    cmds:
      - go mod download
      - go mod tidy

  clean:
    desc: remove executables, temporary, and cached files
    ignore_error: true
    cmds:
      - rm bin/armactl
      - go clean -cache

  lint:
    desc: runs golint
    cmds:
      - golangci-lint run ./...

  test:
    desc: run all tests
    cmds:
      - go test ./...

  test:v:
    desc: run all tests verbose
    cmds:
      - go test -v ./...

  test:cov:
    desc: run all tests and generate coverage
    cmds:
      - go test -covermode=set -coverprofile=coverage.out ./...
    sources:
      - ./**/*.go
    generates:
      - coverage.out
    method: checksum

  build:
    desc: run go build
    cmds:
      - task: proto:gen
      - task: ui:build
      - go build -v -o bin/armactl cmd/armactl/main.go
    sources:
      - ./**/*.go
      - api/proto/**/*.proto
      - web/ui/src/**/*
      - web/ui/index.html
      - web/ui/package.json
    generates:
      - bin/armactl
    method: checksum

  install:
    desc: install executable
    cmds:
      - go install github.com/brittonhayes/armactl/cmd/armactl@latest

  run:
    desc: run the executable
    cmds:
      - task: build
      - bin/armactl

  docs:gen:
    desc: generate documentation via gomarkdocwn
    cmds:
      - go generate ./...

  docs:serve:
    desc: serve godoc server locally
    silent: true
    cmds:
      - echo "Documentation is available at http://localhost:6060/pkg/github.com/brittonhayes/armactl/"
      - godoc -http=:6060

  dev-setup:
    desc: set things up for local development
    cmds:
      - task: mod
      - task: build

  ui:dev:
    desc: start React dev server
    dir: web/ui
    cmds:
      - pnpm run dev

  ui:build:
    desc: build React UI for production
    dir: web/ui
    cmds:
      - pnpm run build
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
    generates:
      - dist/**/*

  build:ui:
    desc: alias for ui:build
    cmds:
      - task: ui:build

  # Protocol Buffer tasks
  proto:gen:
    desc: generate Go and TypeScript types from proto files
    cmds:
      - task: proto:go
      - task: proto:ts
    sources:
      - api/proto/**/*.proto
    generates:
      - web/api/types/*.pb.go
      - web/ui/src/types/proto/*.ts

  proto:go:
    desc: generate Go types from proto files
    cmds:
      - mkdir -p web/api/types
      - protoc --go_out=web/api/types --go_opt=paths=source_relative --proto_path=api/proto api/proto/*.proto
    sources:
      - api/proto/**/*.proto
    generates:
      - web/api/types/*.pb.go

  proto:ts:
    desc: generate TypeScript types from proto files using ts-proto
    dir: web/ui
    cmds:
      - mkdir -p src/types/proto
      - protoc --plugin=protoc-gen-ts_proto=./node_modules/.bin/protoc-gen-ts_proto --ts_proto_out=src/types/proto --ts_proto_opt=onlyTypes=true,stringEnums=true,useOptionals=messages --proto_path=../../api/proto ../../api/proto/*.proto
    sources:
      - ../../api/proto/**/*.proto
    generates:
      - src/types/proto/*.ts