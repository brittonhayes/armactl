syntax = "proto3";

package armactl.api;

option go_package = "github.com/brittonhayes/armactl/web/api/types";

// Server information from Steam queries
message ServerInfo {
  string name = 1;
  string game = 2;
  uint32 players = 3;
  uint32 max_players = 4;
}

// Status of the ARMA server process
message ServerStatus {
  bool running = 1;
  optional int32 pid = 2;
  optional string uptime = 3;
  optional string error = 4;
  optional uint32 players = 5;
  optional uint32 memory = 6;
}

// Configuration options for starting an ARMA server
message ServerOptions {
  string binary = 1;
  string config = 2;
  uint32 port = 3;
  repeated string mods_local = 4;
  repeated string mods_server = 5;
  string world = 6;
  uint32 limit_fps = 7;
  uint32 headless_clients = 8;
  string headless_clients_profile = 9;
  string headless_clients_server = 10;
  string profile = 11;
}